<!doctype html>
<!--
  data-theme="light" pins the app to the light palette regardless of the
  viewer's OS setting. The dark tokens in src/styles/index.css stay
  defined and correct, but nothing reaches them until a theme toggle
  exists to stamp data-theme="dark" here instead.
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Linked here rather than @import-ed from index.css: an @import of a
      remote sheet can't start until our own CSS has been fetched and
      parsed, which puts the font request a round trip behind where it
      needs to be. Same two families the b2b-crm loads.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>ClaimFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
