server {
  listen       8080;
  server_name  _;
  root         /usr/share/nginx/html;

  # The SPA is client-routed: /claims/<id> is a React Router path, not a
  # file. Without this, a reload anywhere but "/" is a 404 from nginx —
  # and reloading on a claim is the first thing anyone does.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed filenames, so they can be cached hard and forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html is the one file that must not be cached: it names the
  # hashed bundles, so a stale copy pins the browser to a deploy that
  # no longer exists.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_types        text/css application/javascript application/json image/svg+xml;
}
